name: Build Docker images

# The path filter must list everything the image is built FROM, not just the
# application code. `gpu-service/Dockerfile` COPYs pyproject.toml + uv.lock and
# then `uv sync --frozen`s against them, so a dependency change that is missing
# here produces a green CI and an unchanged image — and the fleet keeps running
# the old dependency set with nothing reporting it.
# `build_config_test.py::TestDockerWorkflowRebuildsOnItsInputs` enforces this.
on:
  push:
    branches: [main]
    paths:
      - "pipeline/**"
      - "gpu-service/**"
      - "pyproject.toml"
      - "uv.lock"
  pull_request:
    branches: [main]
    paths:
      - "pipeline/**"
      - "gpu-service/**"
      - "pyproject.toml"
      - "uv.lock"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}

jobs:
  gpu-service:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Check Dockerfile exists
        id: check
        run: |
          if [ -f gpu-service/Dockerfile ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::gpu-service/Dockerfile does not exist yet (deferred per CLAUDE.md TODO) — skipping build"
          fi

      - uses: docker/login-action@v3
        if: steps.check.outputs.exists == 'true'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        if: steps.check.outputs.exists == 'true'
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/gpu-service
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        if: steps.check.outputs.exists == 'true'
        with:
          context: .
          file: gpu-service/Dockerfile
          # A manual rebuild has to be able to publish, or it cannot fix the one
          # situation it exists for: a dependency landed without a qualifying
          # path change, `:latest` is behind, and no legitimate push is pending.
          # Dispatch is gated to the default branch, so a run from a feature
          # branch still builds without publishing, exactly like a pull request.
          # The `:latest` tag carries its own `is_default_branch` guard above;
          # this condition governs whether anything is pushed at all.
          push: >-
            ${{ github.event_name == 'push'
            || (github.event_name == 'workflow_dispatch'
            && github.ref == 'refs/heads/main') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Disable provenance + SBOM attestations: every main-branch push of
          # this image (the 15 GB gpu-service one) since 2026-06-10 #43 has
          # been failing the *push* step against GHCR with
          # `ERROR: failed to build: unknown blob`. The pattern matches a
          # known buildx + GHCR interaction where attestation manifests
          # reference blobs by digest that GHCR has not yet committed when
          # the attestation tries to land. Disabling provenance is the
          # documented fix in the docker/build-push-action issue tracker.
          # PR-event builds (push=false) were unaffected because they never
          # reached the push step.
          provenance: false
          sbom: false
