<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chronometraż procesu: wynik badania wykonalności na kamerze „hala prawe skrzydło”</title>
<style>
  /* ANTRA design system (matches gpu-exchange): Antrablack ground, single
     Antraviper accent, Helvena Grotesk + JetBrains Mono, 2px radius, flat
     (no shadows), hairline grid. Dark-only, exactly like the platform. */
  @font-face {
    font-family: "Helvena Grotesk";
    font-weight: 200 900;
    font-style: normal;
    font-display: swap;
    src: url("/fonts/helvena/HelvenaGrotesk-Variable.woff2") format("woff2");
  }

  *, *::before, *::after { box-sizing: border-box; }
  img { max-width: 100%; height: auto; }

  :root {
    --viper: oklch(0.8672 0.2263 127.85);       /* Antraviper #A8ED00 */
    --viper-40: oklch(0.594 0.1537 127.23);     /* viper-40 #658E00 */
    --bg: oklch(0.2134 0 89.88);                /* Antrablack #191919 */
    --surface: oklch(0.25 0 89.88);             /* card */
    --surface-2: oklch(0.285 0 89.88);          /* secondary */
    --ink: oklch(0.937 0 89.88);                /* Antrawhite #EAEAEA */
    --text: oklch(0.80 0 89.88);
    --muted: oklch(0.6401 0 89.88);             /* white-40 #8C8C8C */
    --line: oklch(0.3052 0 89.88);              /* hairline #2F2F2F */
    --line-strong: oklch(0.37 0 89.88);
    --accent: var(--viper);
    --accent-ink: var(--viper);
    --accent-wash: color-mix(in oklch, var(--viper) 10%, transparent);
    --good: var(--viper);
    --good-wash: color-mix(in oklch, var(--viper) 13%, transparent);
    --warn: oklch(0.795 0.184 86.05);
    --warn-wash: color-mix(in oklch, var(--warn) 14%, transparent);
    --bad: oklch(0.68 0.22 25);
    --bad-wash: color-mix(in oklch, var(--bad) 15%, transparent);
    --radius: 2px;
    --font-sans: "Helvena Grotesk", Inter, system-ui, sans-serif;
    --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
    --wrap: 820px;
  }

  body {
    margin: 0;
    color: var(--text);
    font-family: var(--font-sans);
    font-size: 16.5px;
    line-height: 1.66;
    letter-spacing: -0.01em;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    background-color: var(--bg);
    background-image:
      linear-gradient(rgba(234, 234, 234, 0.045) 1px, transparent 1px),
      linear-gradient(90deg, rgba(234, 234, 234, 0.045) 1px, transparent 1px);
    background-size: 39px 39px;
  }

  .page {
    max-width: var(--wrap);
    margin: 0 auto;
    padding: 30px 22px 80px;
    animation: rise .5s cubic-bezier(.2,.7,.2,1) both;
  }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .page { animation: none; } }

  .osd {
    display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center;
    font-family: var(--font-mono);
    font-size: .72rem; letter-spacing: .04em; text-transform: uppercase;
    color: var(--muted);
    padding-bottom: 12px; margin-bottom: 22px;
    border-bottom: 1px solid var(--line);
  }
  .osd .rec { color: var(--accent-ink); font-weight: 600; display: inline-flex; align-items: center; gap: 7px; }
  .osd .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--bad); box-shadow: 0 0 0 3px var(--bad-wash); }
  .osd .sep { color: var(--line-strong); }
  .osd .push { margin-left: auto; }

  .hero { position: relative; padding: 30px 30px 28px; margin-bottom: 34px; }
  .hero::before, .hero::after, .hero .br-tr, .hero .br-br {
    content: ""; position: absolute; width: 22px; height: 22px;
    border: 2px solid var(--accent); opacity: .85;
  }
  .hero::before { top: 0; left: 0; border-right: 0; border-bottom: 0; }
  .hero::after  { bottom: 0; left: 0; border-right: 0; border-top: 0; }
  .hero .br-tr  { top: 0; right: 0; border-left: 0; border-bottom: 0; }
  .hero .br-br  { bottom: 0; right: 0; border-left: 0; border-top: 0; }

  .eyebrow {
    font-family: var(--font-mono);
    font-size: .74rem; letter-spacing: .14em; text-transform: uppercase;
    color: var(--accent-ink); font-weight: 600; margin: 0 0 14px;
  }
  h1 {
    font-size: clamp(1.85rem, 5vw, 2.5rem);
    line-height: 1.12; letter-spacing: -.02em; font-weight: 800;
    color: var(--ink); margin: 0 0 14px; text-wrap: balance;
  }
  .lede { font-size: 1.08rem; color: var(--text); margin: 0; max-width: 62ch; }
  .lede strong { color: var(--ink); font-weight: 650; }

  section { margin-top: 44px; }
  h2 {
    font-size: 1.32rem; line-height: 1.25; letter-spacing: -.015em; font-weight: 750;
    color: var(--ink); margin: 0 0 4px; text-wrap: balance;
  }
  .kicker {
    font-family: var(--font-mono); font-size: .72rem; letter-spacing: .12em;
    text-transform: uppercase; color: var(--muted); font-weight: 600;
    display: block; margin-bottom: 8px;
  }
  h2 + .sub { color: var(--muted); margin: 2px 0 18px; font-size: .96rem; }
  p { margin: 0 0 14px; }
  a { color: var(--accent-ink); }
  strong { color: var(--ink); }

  .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-top: 22px; }
  @media (max-width: 640px) { .cards { grid-template-columns: 1fr; } }
  .card {
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 18px 18px 20px; position: relative; overflow: hidden;
  }
  .card::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 3px; background: var(--tone, var(--accent)); }
  .card.good { --tone: var(--good); }
  .card.warn { --tone: var(--warn); }
  .card.do   { --tone: var(--accent); }
  .card .tag {
    font-family: var(--font-mono); font-size: .68rem; letter-spacing: .1em; text-transform: uppercase;
    font-weight: 700; color: var(--tone, var(--accent)); margin-bottom: 8px; display: block;
  }
  .card h3 { font-size: 1.02rem; color: var(--ink); margin: 0 0 6px; font-weight: 700; line-height: 1.3; }
  .card p { font-size: .92rem; margin: 0; color: var(--text); }

  .panel {
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 22px 24px; margin-top: 18px;
  }

  .flow { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 20px; }
  @media (max-width: 640px) { .flow { grid-template-columns: repeat(2, 1fr); } }
  .step {
    background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 14px 14px 16px; position: relative;
  }
  .step .n { font-family: var(--font-mono); font-size: .72rem; font-weight: 700; color: var(--accent-ink); letter-spacing: .05em; }
  .step h4 { margin: 6px 0 4px; font-size: .95rem; color: var(--ink); font-weight: 700; }
  .step p { font-size: .84rem; margin: 0; color: var(--muted); }

  .tablewrap { overflow-x: auto; margin-top: 18px; border: 1px solid var(--line); border-radius: var(--radius); }
  table { border-collapse: collapse; width: 100%; font-size: .92rem; min-width: 440px; }
  caption { caption-side: bottom; text-align: left; color: var(--muted); font-size: .82rem; padding: 10px 14px 0; }
  th, td { padding: 11px 14px; text-align: left; border-bottom: 1px solid var(--line); }
  thead th {
    font-family: var(--font-mono); font-size: .7rem; text-transform: uppercase; letter-spacing: .07em;
    color: var(--muted); font-weight: 700; background: var(--surface-2);
  }
  tbody tr:last-child td { border-bottom: 0; }
  td.num, th.num { text-align: right; font-family: var(--font-mono); font-variant-numeric: tabular-nums; color: var(--ink); }
  tbody tr td:first-child { color: var(--ink); font-weight: 600; }

  .frame {
    position: relative; aspect-ratio: 16 / 7; background: var(--surface);
    border: 1px solid var(--line-strong); border-radius: var(--radius); margin-top: 8px; overflow: hidden;
  }
  .frame .grid {
    position: absolute; inset: 0;
    background-image: linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size: 40px 40px; opacity: .6;
  }
  .frame .floor { position: absolute; left: 0; right: 0; bottom: 0; height: 34%; background: var(--accent-wash); }
  .fig { position: absolute; bottom: 12%; display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .fig .body { width: 100%; background: var(--accent); border-radius: 40% 40% 14% 14% / 22% 22% 10% 10%; }
  .fig .head { border-radius: 50%; background: var(--accent); }
  .fig .lab {
    font-family: var(--font-mono); font-size: .64rem; letter-spacing: .04em; white-space: nowrap;
    color: var(--ink); background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 1px 8px; margin-top: 3px;
  }
  .fig.near { left: 9%; }
  .fig.near .head { width: 22px; height: 22px; }
  .fig.near .body { height: 92px; }
  .fig.far { right: 12%; }
  .fig.far .body { height: 15px; }
  .fig.far .head { width: 5px; height: 5px; }
  .fig.far .lab { color: var(--bad); border-color: color-mix(in oklch, var(--bad) 55%, transparent); }

  .bands { display: grid; gap: 8px; margin-top: 20px; }
  .band {
    display: grid; grid-template-columns: 96px 1fr; align-items: center; gap: 14px;
    background: var(--surface-2); border: 1px solid var(--line); border-left: 3px solid var(--tone);
    border-radius: var(--radius); padding: 10px 14px;
  }
  @media (max-width: 520px) { .band { grid-template-columns: 1fr; gap: 4px; } }
  .band.g { --tone: var(--good); }
  .band.gg { --tone: var(--good); }
  .band.w { --tone: var(--warn); }
  .band.b { --tone: var(--bad); }
  .band .size { font-family: var(--font-mono); font-weight: 700; color: var(--ink); font-size: .92rem; }
  .band .verdict { font-size: .9rem; }
  .band .verdict b { color: var(--tone); }

  ul.check { list-style: none; padding: 0; margin: 16px 0 0; display: grid; gap: 11px; }
  ul.check li { position: relative; padding-left: 30px; }
  ul.check li::before {
    content: "✓"; position: absolute; left: 0; top: 1px;
    width: 20px; height: 20px; border-radius: 50%; background: var(--good-wash); color: var(--good);
    font-size: .8rem; font-weight: 800; display: grid; place-items: center;
  }
  ul.check li strong { color: var(--ink); }

  ul.plain { padding-left: 20px; margin: 12px 0 0; }
  ul.plain li { margin-bottom: 8px; }

  .callout {
    display: flex; gap: 14px; align-items: flex-start;
    background: var(--accent-wash); border: 1px solid color-mix(in oklch, var(--accent) 34%, transparent);
    border-radius: var(--radius); padding: 16px 18px; margin-top: 20px;
  }
  .callout .mk { font-family: var(--font-mono); font-weight: 800; color: var(--accent-ink); font-size: 1.1rem; line-height: 1.3; }
  .callout p { margin: 0; font-size: .95rem; }
  .callout p strong { color: var(--accent-ink); }

  .note { font-size: .82rem; color: var(--muted); margin-top: 12px; }

  .status { display: grid; gap: 10px; margin-top: 18px; }
  .srow {
    display: grid; grid-template-columns: auto 1fr; gap: 12px; align-items: baseline;
    padding: 12px 16px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  }
  .pill {
    font-family: var(--font-mono); font-size: .66rem; letter-spacing: .08em; text-transform: uppercase;
    font-weight: 700; padding: 3px 9px; border-radius: var(--radius); white-space: nowrap;
  }
  .pill.ok { background: var(--good-wash); color: var(--good); }
  .pill.wait { background: var(--warn-wash); color: var(--warn); }
  .pill.pause { background: var(--surface-2); color: var(--muted); border: 1px solid var(--line-strong); }
  .srow p { margin: 0; font-size: .93rem; }
  .srow p strong { color: var(--ink); }

  footer {
    margin-top: 54px; padding-top: 18px; border-top: 1px solid var(--line);
    font-family: var(--font-mono); font-size: .74rem; letter-spacing: .04em; color: var(--muted);
    display: flex; flex-wrap: wrap; gap: 6px 16px; justify-content: space-between;
  }
</style>
</head>
